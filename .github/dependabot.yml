version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint et Next.js ont besoin de l'API JS de TypeScript 6 ;
      # TypeScript 7 est déjà utilisé pour le typecheck via l'alias
      # typescript-7 (voir package.json). À retirer quand typescript-eslint
      # supportera TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ESLint 10 a supprimé context.getFilename(), encore utilisé par
      # eslint-plugin-react (via eslint-config-next). À retirer quand le
      # plugin supportera ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
