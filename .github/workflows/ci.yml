name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valeurs factices : le build n'appelle pas Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # TypeScript 7 (compilateur natif). `typescript` reste en 6.x pour les
      # outils qui utilisent son API (typescript-eslint, Next.js).
      - run: npm run typecheck
      - name: Unit + API tests (coverage)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Couverture (Vitest)"
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| Métrique | % |\n|---|---|');for(const k of ['statements','branches','functions','lines'])console.log('| '+k+' | '+t[k].pct+' |')"
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7
      - run: npm run build

  e2e:
    name: DB tests + E2E (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # On ne démarre que les services utilisés (db, auth, rest, gateway) :
      # moins d'images à tirer => plus de "toomanyrequests" ni de lenteur.
      - name: Start Supabase local
        run: |
          for i in 1 2 3; do
            supabase start -x studio,logflare,vector,mailpit,edge-runtime,imgproxy,realtime,storage-api,postgres-meta,supavisor && exit 0
            echo "supabase start a échoué (tentative $i), nouvel essai..."
            supabase stop --no-backup || true
            sleep 20
          done
          exit 1

      - name: Database tests
        run: supabase test db

      - name: Database lint
        run: supabase db lint --schema public --level error --fail-on error

      - name: Export local Supabase env
        run: |
          supabase status -o env > /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/sb.env | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"

      # Build APRÈS Supabase : les NEXT_PUBLIC_* sont inlinés dans le bundle.
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start app
        run: npm start &
        env:
          PORT: 3000

      - run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      # Same app instance (production build), audited as a signed-in user.
      # Minimum scores: lighthouse-budget.json.
      - name: Lighthouse
        run: node scripts/lighthouse.mjs
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: lighthouse-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Stop Supabase local
        if: always()
        run: supabase stop --no-backup
