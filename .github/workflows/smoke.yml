name: Smoke test

# Après chaque déploiement de production réussi (Vercel publie un événement
# `deployment_status`), vérifie que l'app répond réellement, et que c'est bien
# le commit déployé qui est servi. Les prévisualisations sont protégées par
# Vercel et donc ignorées ici.
#
# On teste l'adresse publique de production, PAS l'URL unique du déploiement
# (`environment_url`) : celle-ci est protégée par l'authentification Vercel et
# répond 302. Pour changer d'adresse : variable de dépôt PRODUCTION_URL.
# Les vérifications sont dans scripts/smoke.sh, aussi exécuté par la CI sur
# l'app locale à chaque PR.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL à tester (par défaut, l'adresse de production)
        required: false

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Run smoke test
        env:
          # Passed through the environment, never interpolated into the shell.
          TARGET_URL: ${{ inputs.url || vars.PRODUCTION_URL || 'https://budget-web-app-cyan.vercel.app' }}
          # Only set for real deployments: wait until this commit is served.
          EXPECTED_SHA: ${{ github.event.deployment.sha }}
        run: bash scripts/smoke.sh "$TARGET_URL" "$EXPECTED_SHA"
