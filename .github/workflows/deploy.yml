name: Deploy

# Vercel déploie l'application via son intégration Git, indépendamment de ce workflow.
# Seul apply utilise l'environnement approuvé ; plan n'applique aucune migration.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simulation seulement (liste les migrations sans les appliquer)
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
              echo "::error::Plan impossible, secrets manquants:$missing"
              exit 1
            fi
            echo "::warning::Simulation ignorée, secrets manquants:$missing"
            echo "Simulation ignorée : secrets manquants:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.116.0

      - name: Plan database migrations
        id: plan
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          log="$RUNNER_TEMP/migrations-plan.txt"
          # stdout ET stderr : le CLI écrit la liste des migrations sur stderr.
          # Le statut de db push est conservé même si tee réussit.
          status=0
          supabase db push --dry-run 2>&1 | tee "$log" || status=$?
          {
            echo '### Migrations en attente (simulation)'
            echo '```text'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          # CLI 2.116.0 : seul ce texte prouve qu'aucune migration n'est en attente.
          if grep -Fq 'Remote database is up to date.' "$log"; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

  apply:
    needs: plan
    if: needs.plan.outputs.pending == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    environment: production-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.116.0
      - name: Apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
